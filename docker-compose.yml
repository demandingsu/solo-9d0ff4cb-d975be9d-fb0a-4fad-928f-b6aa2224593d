services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/db/measurements.db
      INCOMING_DIR: /data/incoming
      VOUCHER_DIR: /data/vouchers
      # Demo hooks (see README "演示 3/4"):
      #  - this voucher fails on its first generation, then succeeds on retry
      #  - this voucher "crashes" the process after the CSV is fully written
      #    but before the status is saved; restart recovery adopts the file
      VOUCHER_FAIL_REQUEST_IDS: "demo-fail"
      VOUCHER_CRASH_AFTER_RENAME: "demo-crash"
    volumes:
      - measurements-db:/data/db      # persistent measurement database
      - incoming:/data/incoming       # shared collection directory
      - vouchers:/data/vouchers       # generated handover CSVs
    restart: unless-stopped

  simulator:
    build: ./simulator
    environment:
      INCOMING_DIR: /data/incoming
      WRITE_INTERVAL_SECONDS: "1.0"   # one weighing per second
      ROTATE_SECONDS: "45"            # accelerated 'daily' rotation
      PARTIAL_EVERY_N_LINES: "7"      # every 7th line is written in two halves
      LATE_LINES_AFTER_ROTATION: "2"  # late records appended to the rotated file
    volumes:
      - incoming:/data/incoming
    restart: unless-stopped

  # Optional: trigger collection periodically so you can just watch it run.
  # Manual collection always works too: curl -X POST localhost:8000/collect
  collector-tick:
    image: curlimages/curl:8.11.1
    depends_on:
      - app
    command: >
      sh -c "sleep 5;
             while true; do
               curl -s -X POST http://app:8000/collect -H 'Content-Type: application/json' -d '{}';
               echo; sleep 10;
             done"
    restart: unless-stopped

volumes:
  measurements-db:
  incoming:
  vouchers:
